name: Handle Issues

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write # needed to dispatch the process-issue workflow
  issues: write

env:
  # Comma-separated GitHub usernames
  MAINTAINERS: SpaceEnergy,noxygalaxy # may run /process on any request
  TRUSTED_REQUESTERS: SpaceEnergy,noxygalaxy,nomd346,theygotti # may run /process on their own open requests

jobs:
  triage:
    # Only issues created from the artwork request template
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'request')
    runs-on: ubuntu-latest
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Check request
        uses: actions/github-script@v7
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        with:
          script: await require('./scripts/issue-bot.js').triage({ github, context, core })

  process-command:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/process')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Start processing
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/issue-bot.js').processCommand({ github, context, core })
