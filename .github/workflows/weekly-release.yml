name: Weekly Release

on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Check for new AppIDs
        id: new-appids
        run: |
          LAST_RELEASE_TAG=$(git ls-remote --tags origin | grep -oP 'refs/tags/v\K[0-9]+' | sort -V | tail -1)
          [ -n "$LAST_RELEASE_TAG" ] && LAST_RELEASE_TAG="v$LAST_RELEASE_TAG"
          
          if [ -z "$LAST_RELEASE_TAG" ]; then
            # No previous tags, use a very old date
            LAST_RELEASE_DATE=$(date -d "2000-01-01" -u +"%Y-%m-%dT%H:%M:%S")
            echo "No previous release tag found, using 2000-01-01"
          else
            # Extract date from tag (e.g., v20260525 -> 2026-05-25)
            TAG_DATE=$(echo "$LAST_RELEASE_TAG" | sed 's/v//')
            FORMATTED_DATE=$(echo "$TAG_DATE" | sed 's/\([0-9]\{4\}\)\([0-9]\{2\}\)\([0-9]\{2\}\)/\1-\2-\3/')
            LAST_RELEASE_DATE=$(date -d "$FORMATTED_DATE" -u +"%Y-%m-%dT%H:%M:%S")
            echo "Last release was: $LAST_RELEASE_TAG ($LAST_RELEASE_DATE)"
          fi
          
          # Get all commits since the last release with the format "Add artwork for app XXXX"
          COMMIT_HISTORY=$(git log --since="$LAST_RELEASE_DATE" --pretty=format:"%s" origin/main)
          
          # Extract all app IDs from commit messages (excluding the release commit itself)
          APP_IDS=$(echo "$COMMIT_HISTORY" | grep -oP 'Add artwork for app \K[0-9]+' | sort -u)
          
          if [ -z "$APP_IDS" ]; then
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "Nothing new since last release."
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "Found AppIDs: $APP_IDS"
            # Save for later use
            echo "$APP_IDS" > /tmp/app_ids.txt
          fi

      - name: Take screenshots
        run: node scripts/screenshot.js

      - name: Create zip
        run: |
          cd screenshots
          zip -r ../grid.zip grid

      - name: Set release date
        run: echo "RELEASE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Format release notes
        run: |
          if [ -f /tmp/app_ids.txt ] && [ -s /tmp/app_ids.txt ]; then
            FORMATTED_IDS=$(while read id; do echo -n "[\`$id\`](https://steamdb.info/app/$id), "; done < /tmp/app_ids.txt | sed 's/, $//')
            echo "FORMATTED_IDS<<EOF" >> $GITHUB_ENV
            echo "$FORMATTED_IDS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "FORMATTED_IDS=No new AppIDs" >> $GITHUB_ENV
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.RELEASE_DATE }}"
          name: "v${{ env.RELEASE_DATE }}"
          body: |
            New artworks for the following games:
            ${{ env.FORMATTED_IDS }}
          files: grid.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/app_ids.txt
          echo "Cleaned up temporary files"
