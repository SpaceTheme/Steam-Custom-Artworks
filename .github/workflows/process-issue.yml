name: Process Issue

on:
  repository_dispatch:
    types: [process-issue]

permissions:
  contents: write
  issues: write

concurrency:
  group: process-issue-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # Chrome is only needed for the weekly release

      - name: Read request from issue
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/issue-bot.js').readRequest({ github, context })

      - name: Build artwork
        id: build
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: node scripts/process-issue.js request.json result.json

      - name: Commit and push
        id: push
        if: steps.build.outputs.ok == 'true'
        env:
          APP_ID: ${{ steps.build.outputs.app_id }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A artworks/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # The weekly release collects app IDs from "Add artwork for app <id>" commit messages.
          git commit -m "Add artwork for app ${APP_ID} (#${ISSUE_NUMBER})"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Failed to push after 10 attempts"
          exit 1

      - name: Report result on issue
        if: always()
        uses: actions/github-script@v7
        env:
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: await require('./scripts/issue-bot.js').report({ github, context, core })
