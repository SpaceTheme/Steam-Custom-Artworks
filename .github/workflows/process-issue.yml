name: Process Issue

on:
  repository_dispatch:
    types: [process-issue]

permissions:
  contents: write
  issues: write

concurrency:
  group: process-issue-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # Chrome is only needed for the weekly release

      - name: Read request from issue
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/issue-bot.js').readRequest({ github, context })

      - name: Build artwork
        id: build
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: node scripts/process-issue.js request.json result.json

      - name: Update plugin manifest
        if: steps.build.outputs.ok == 'true'
        run: node scripts/build-manifest.js

      - name: Commit and push
        id: push
        if: steps.build.outputs.ok == 'true'
        env:
          APP_ID: ${{ steps.build.outputs.app_id }}
        # The artwork and artworks/manifest.json in one commit.
        # The weekly release collects app IDs from "Add artwork for app <id>" commit messages.
        run: scripts/push-changes.sh "Add artwork for app ${APP_ID} (#${ISSUE_NUMBER})"

      - name: Report result on issue
        if: always()
        uses: actions/github-script@v7
        env:
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: await require('./scripts/issue-bot.js').report({ github, context, core })
